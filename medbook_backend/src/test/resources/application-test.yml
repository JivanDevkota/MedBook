spring:
  datasource:
    url: jdbc:h2:mem:medbook;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: false

logging:
  level:
    org.hibernate.SQL: WARN
    org.springframework.security: WARN

app:
  bootstrap:
    admin:
      email: admin@test.local
      password: Admin@12345
